# YGU OJ 一键部署：
#   cd deploy && ./init-env.sh && docker compose up -d --build
# 数据目录为仓库根目录下的 data/，MySQL 与 Redis 使用命名卷。

name: ygu-oj

x-backend: &backend
  build: ../backend
  image: ygu-oj/backend
  env_file: .env
  environment:
    MYSQL_HOST: mysql
    REDIS_URL: redis://redis:6379
    OJ_DATA_DIR: /data
    # 后端端口不对外暴露，请求都经过 Nginx，可信任其设置的 X-Real-IP
    TRUST_X_REAL_IP: "true"
  volumes:
    - ../data:/data
    - static:/app/staticfiles
  networks:
    - default
    - judge
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery:
    <<: *backend
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}

  # QDUOJ 判题服务（JudgeServer + Judger 沙箱），配置沿用 QDUOJ 官方部署。
  # 只接入内部网络 judge：用户代码无法访问外网，也连不到 MySQL、Redis。
  # 这对 Java 尤为重要，因为 Java 运行时不启用 seccomp。
  judge-server:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1
    # 固定主机名，后台列表中不随容器重建而变化
    hostname: judge-server
    restart: unless-stopped
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - ../data/test_case:/test_case:ro
      - ../data/judge_server/log:/log
      - ../data/judge_server/run:/judger
    environment:
      SERVICE_URL: http://judge-server:8080
      BACKEND_URL: http://backend:8000/api/judge-server/heartbeat
      TOKEN: ${JUDGE_SERVER_TOKEN}
    networks:
      - judge

  nginx:
    build: ../frontend
    image: ygu-oj/nginx
    restart: unless-stopped
    ports:
      - "${OJ_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/static:ro
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  # 判题网络：只有 backend、celery、judge-server，且不能访问外网
  judge:
    internal: true

volumes:
  mysql-data:
  redis-data:
  static:
